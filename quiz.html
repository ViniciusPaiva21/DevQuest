<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quiz de tecnologia do DevQuest">
  <title>DevQuest - Quiz</title>

  <script src="js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.468.0"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/themes.css">
</head>

<body data-page="quiz" class="min-h-screen flex flex-col selection:bg-violet-500 selection:text-white overflow-x-hidden">
  <header class="w-full py-5 px-6 border-b border-zinc-800/60 bg-zinc-950/70 backdrop-blur-xl sticky top-0 z-50">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-3 group" aria-label="Voltar ao início">
        <span class="p-2 bg-zinc-900 rounded-lg border border-zinc-800 group-hover:border-violet-500/50 transition-colors">
          <i data-lucide="terminal" class="text-violet-400 w-6 h-6"></i>
        </span>
        <span class="text-xl font-bold tracking-tight text-zinc-100 group-hover:text-violet-300 transition-colors">
          Dev<span class="text-violet-500">Quest</span>
        </span>
      </a>

      <div class="header-actions flex items-center gap-2">
        <a href="disciplinas.html" class="quiz-infernus-link text-sm font-semibold text-zinc-400 hover:text-white transition-colors">
          Disciplinas
        </a>
        <a href="infernus.html" class="quiz-infernus-link text-sm font-semibold text-zinc-400 hover:text-white transition-colors">
          Modo Infernus
        </a>
        <div data-theme-slot></div>
      </div>
    </div>
  </header>

  <main class="flex-grow flex flex-col items-center px-4 py-12 relative w-full max-w-5xl mx-auto">
    <div class="pointer-events-none absolute top-0 left-1/4 w-96 h-96 bg-violet-600/10 rounded-full blur-3xl -z-10 animate-pulse-slow"></div>

    <section class="text-center mb-8 z-10" aria-labelledby="quiz-title">
      <div id="quiz-course-badge" class="quiz-course-badge hidden"></div>
      <div class="inline-flex items-center justify-center p-3 bg-zinc-900/50 rounded-2xl border border-zinc-800 mb-4">
        <i id="quiz-icon" data-lucide="brain" class="text-violet-400 w-8 h-8"></i>
      </div>
      <h1 id="quiz-title" class="text-3xl md:text-4xl font-extrabold tracking-tight mb-2 text-white">Quiz</h1>
      <p id="quiz-subtitle" class="text-zinc-400">Carregando matéria...</p>
    </section>

    <div id="loading" role="status" class="text-violet-400 font-bold text-xl animate-pulse">
      Aguarde, buscando questões...
    </div>

    <section id="quiz-container" class="w-full max-w-3xl z-10 hidden" aria-live="polite">
      <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div id="round-badge" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-zinc-800 bg-zinc-900/70 text-sm text-zinc-300"></div>
        <div id="progress-badge" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-zinc-800 bg-zinc-900/70 text-sm text-zinc-300"></div>
      </div>

      <div id="question-area" class="bg-zinc-900/60 border border-zinc-800 p-6 md:p-8 rounded-3xl shadow-2xl w-full overflow-visible"></div>

      <button id="next-btn" type="button" class="hidden w-full mt-6 py-4 bg-white text-zinc-950 font-bold rounded-xl hover:bg-zinc-200 transition-colors shadow-lg active:scale-[0.99]">
        Próxima pergunta ➡️
      </button>
    </section>

    <section id="final-screen" class="hidden w-full max-w-2xl text-center bg-zinc-900/60 border border-zinc-800 p-8 md:p-10 rounded-3xl shadow-2xl z-10" aria-live="polite">
      <h2 id="final-title" class="text-3xl font-bold text-white mb-4">Quiz concluído</h2>
      <p id="score-text" class="text-2xl text-violet-400 font-bold mb-4"></p>
      <p id="final-detail" class="text-zinc-300 mb-8"></p>

      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button id="restart-btn" type="button" class="px-8 py-3 bg-white text-zinc-950 font-bold rounded-xl hover:bg-zinc-200 transition-colors">
          Jogar novamente
        </button>
        <a href="disciplinas.html" class="px-8 py-3 bg-zinc-800 text-white font-bold rounded-xl hover:bg-zinc-700 transition-colors border border-zinc-700">
          Voltar às disciplinas
        </a>
      </div>
    </section>
  </main>

  <footer class="w-full py-8 border-t border-zinc-800/50 bg-zinc-950 mt-auto">
    <p class="text-zinc-500 text-sm flex items-center justify-center gap-1">
      Feito com <i data-lucide="coffee" class="text-amber-700 w-3 h-3"></i> por Vinicius
    </p>
  </footer>

  <audio id="meow1" src="audios/miado1.mp3" preload="none"></audio>
  <audio id="meow2" src="audios/miado2.mp3" preload="none"></audio>
  <audio id="meow3" src="audios/miado3.mp3" preload="none"></audio>
  <audio id="meow4" src="audios/miado4.mp3" preload="none"></audio>
  <audio id="meow5" src="audios/miado5.mp3" preload="none"></audio>

  <button id="cat-button" type="button" class="fixed bottom-3 right-3 z-50 group" aria-label="Ouvir o mascote">
    <span id="cat-bubble" class="absolute -top-10 -left-5 bg-white text-zinc-900 text-xs font-bold px-3 py-1 rounded-xl rounded-br-none transition-all duration-300 shadow-lg opacity-0 scale-90 translate-y-2 pointer-events-none">
      Miau! 🐾
    </span>
    <img id="cat-svg" src="icons/gato.svg" alt="" class="w-28 h-28 object-contain transition-transform duration-300 group-hover:-translate-y-2">
  </button>

  <script src="js/subjects.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const subjectId = params.get("materia");
      const requestedCourseId = params.get("curso")?.toUpperCase();
      const subject = window.DEVQUEST_SUBJECTS?.[subjectId];

      if (!subject) {
        window.location.replace("disciplinas.html");
        return;
      }

      const matchingCourses = Object.entries(window.DEVQUEST_COURSES || {})
        .filter(([, course]) => course.subjects.includes(subjectId));
      const requestedCourse = matchingCourses.find(([courseId]) => courseId === requestedCourseId);
      const resolvedCourse = requestedCourse || (matchingCourses.length === 1 ? matchingCourses[0] : null);

      window.QUIZ_CONFIG = {
        id: subjectId,
        ...subject,
        courseId: resolvedCourse?.[0] || null,
        courseLabel: resolvedCourse?.[1]?.fullLabel || null
      };
    })();
  </script>
  <script src="js/utils.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/cat.js"></script>
</body>
</html>
