<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quizzes de ADS e Ciência da Computação organizados por trilha.">
  <title>DevQuest - Multiplayer</title>

  <script src="js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.468.0"></script>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/decoreba.css">
  <link rel="stylesheet" href="css/mode-nav.css">
<link rel="stylesheet" href="css/multiplayer.css">
<script defer src="js/multiplayer.js"></script>
</head>

<body data-page="home" class="min-h-screen flex flex-col selection:bg-violet-500 selection:text-white overflow-x-hidden">
  <header class="site-header w-full px-5 md:px-6 py-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto decoreba-nav-shell flex items-center justify-between gap-4">
      <a href="index.html" class="brand flex items-center gap-3 group" aria-label="Página inicial do DevQuest">
        <span class="brand-icon p-2.5 rounded-xl">
          <i data-lucide="terminal" class="text-violet-400 w-6 h-6"></i>
        </span>
        <span>
          <span class="block text-xl font-extrabold tracking-tight text-zinc-100">
            Dev<span class="text-violet-500">Quest</span>
          </span>
          <span class="block text-[11px] text-zinc-500">De alunos para alunos</span>
        </span>
      </a>

      <nav class="flex items-center gap-2" aria-label="Navegação principal">
        <a href="index.html#destaques" class="header-link hidden md:inline-flex dq-page-link"><svg class="dq-page-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></svg><span>Destaques</span></a>
        <a href="disciplinas.html" class="header-link hidden sm:inline-flex dq-page-link"><svg class="dq-page-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/><path d="M6 8h1m10 0h1M6 12h1m10 0h1"/></svg><span>Todas</span></a>
        <a href="infernus.html" class="header-link dq-mode-link"><span class="dq-mode-icon dq-icon-infernus" aria-hidden="true"></span><span>Infernus</span></a>
        <a href="decoreba.html" class="header-link dq-mode-link"><span class="dq-mode-icon dq-icon-decoreba" aria-hidden="true"></span><span>Decoreba</span></a>
        <a href="multiplayer.html" class="header-link dq-mode-link" aria-current="page"><span class="dq-mode-icon dq-icon-multiplayer" aria-hidden="true"></span><span>Multiplayer</span></a>
        <div data-theme-slot></div>
      </nav>
    </div>
  </header>

  <main class="mp-main">
    <section class="mp-intro"><span class="mp-kicker">DEVQUEST / MULTIPLAYER</span><h1>Escolha sua identidade</h1><p>Desafie seus amigos em partidas por turnos de 2 a 5 jogadores.</p></section>
    <section class="mp-panel" aria-labelledby="mp-title">
      <div class="mp-profile"><div class="mp-preview"><img id="mp-avatar-preview" src="images/avatars/vampiro.png" alt="Vampiro"></div><div><h2 id="mp-title">Seu perfil</h2><p id="mp-avatar-name">Vampiro</p><label for="mp-name">Apelido</label><input id="mp-name" maxlength="24" autocomplete="nickname" placeholder="Digite seu apelido"></div></div>
      <h3>Escolha seu avatar</h3><div id="mp-avatars" class="mp-avatars" role="group" aria-label="Avatares disponíveis"></div>
      <div class="mp-actions"><button id="mp-create" type="button" disabled>Criar sala</button><button id="mp-join" type="button" disabled>Entrar em uma sala</button></div>
      <div id="mp-next" class="mp-next" hidden aria-live="polite"></div>
      <p class="mp-note">Prévia da interface · As salas online ainda não estão disponíveis.</p>
    </section>
  </main>
  <script>if (window.lucide) lucide.createIcons();</script>
</body></html>
