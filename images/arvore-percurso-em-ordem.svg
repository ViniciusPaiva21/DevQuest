<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title description">
  <title id="title">Árvore binária para percurso em ordem</title>
  <desc id="description">Árvore com raiz 3, filhos 1 e 6, e os demais nós 2, 4, 5 e 7.</desc>

  <rect width="720" height="420" rx="24" fill="#18181b"/>

  <g stroke="#a1a1aa" stroke-width="6" stroke-linecap="round">
    <line x1="360" y1="78" x2="210" y2="142"/>
    <line x1="360" y1="78" x2="520" y2="142"/>
    <line x1="210" y1="168" x2="115" y2="242"/>
    <line x1="210" y1="168" x2="300" y2="242"/>
    <line x1="520" y1="168" x2="450" y2="242"/>
    <line x1="115" y1="268" x2="65" y2="342"/>
  </g>

  <g fill="#27272a" stroke="#e4e4e7" stroke-width="4">
    <circle cx="360" cy="65" r="34"/>
    <circle cx="210" cy="155" r="34"/>
    <circle cx="520" cy="155" r="34"/>
    <circle cx="115" cy="255" r="34"/>
    <circle cx="300" cy="255" r="34"/>
    <circle cx="450" cy="255" r="34"/>
    <circle cx="65" cy="355" r="34"/>
  </g>

  <g fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <text x="360" y="65">3</text>
    <text x="210" y="155">1</text>
    <text x="520" y="155">6</text>
    <text x="115" y="255">2</text>
    <text x="300" y="255">5</text>
    <text x="450" y="255">7</text>
    <text x="65" y="355">4</text>
  </g>
</svg>
